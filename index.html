<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de SmartQR</title>
    <!-- Runtime configuration (Supabase URL/key). Served by server.js from environment variables;
         public/config.js is the empty fallback used by `npm run dev`. -->
    <script src="/config.js"></script>
    <!-- Apply the panel's light/dark mode before the first paint (see context/ColorModeContext.tsx) -->
    <script>
      try {
        var mode = localStorage.getItem('smartqr-color-mode');
        if (mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-canvas text-fg font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
